<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

<header>
    <h1>QuickNotes</h1>
    <p>Capture ideas before they disappear.</p>
</header>

<main>

<section>

<h2>Add a note</h2>

<form id="note-form">

<label for="note-input">New Note</label>

<input
id="note-input"
type="text"
maxlength="200">

<select id="note-category">
<option value="personal">Personal</option>
<option value="work">Work</option>
<option value="study">Study</option>
</select>

<button type="submit">
Add Note
</button>

</form>

<p id="error-message"></p>

</section>

<section>

<h2>Your Notes</h2>

<input
id="search-input"
type="text"
placeholder="Search notes...">

<p id="note-count"></p>

<ul id="notes-list"></ul>

</section>

</main>

<footer>

<p>© 2026 QuickNotes</p>

</footer>

</body>
</html>
